[package]
name = "webcam_capture"
version = "1.0.0"
edition = "2021"
authors = ["ysrmacbook"]
description = "Webcam goruntusunu e-Devlet biyometrik fotograf olculerine (133x171) donusturen Rust uygulamasi"

[dependencies]
nokhwa = { version = "0.10.11", features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
wry = "0.57"
tao = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
rfd = "0.15"
open = "5.3"
tiny_http = "0.12.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Storage_Streams",
] }
windows-future = "0.3"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true



